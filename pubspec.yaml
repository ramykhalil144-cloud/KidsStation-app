name: kids_station_app
description: تطبيق كيدز ستاشن مصر - دليل الفروع والحجز الإلكتروني وبوابة استقبال الفروع المربوط بـ Firebase
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # حزم الربط مع Firebase ومسح الـ QR لبوابات الفروع
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  firebase_auth: ^4.19.0
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
